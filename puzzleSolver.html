<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8×8 拼圖求解器</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;margin:0;background:#f5f7fb;color:#202938}.wrap{max-width:850px;margin:24px auto;padding:16px}h1{font-size:25px}.panel{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 20px #18263a13;margin-bottom:16px}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:0;max-width:520px}.cell{aspect-ratio:1;border:1px solid #d7deea;box-sizing:border-box;overflow:visible;white-space:nowrap;background:#eef2f8;display:grid;place-items:center;font-weight:700;cursor:pointer;color:#fff;font-size:14px}.cell.block{background:#333}.cell.filled{cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:8px;padding:10px 15px;background:#2563eb;color:white;cursor:pointer;font-weight:650}button.hintbtn{background:#f59e0b}.cell.hint{outline:4px solid #f59e0b;outline-offset:-4px;animation:pulse 1s infinite;background:#fff3d6;color:#b45309}@keyframes pulse{50%{background:#ffe2a3}}button.secondary{background:#e8eef9;color:#243651}button:disabled{opacity:.5}input{width:64px;padding:7px;border:1px solid #cbd5e1;border-radius:6px}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid #edf0f5;text-align:left}small,.muted{color:#617085}.status{padding:12px;border-radius:9px;background:#f0f4fa;margin-top:10px;white-space:pre-wrap}.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:middle}@media(max-width:600px){.wrap{padding:10px;margin:0}.panel{padding:12px}td,th{padding:5px 3px;font-size:13px}input{width:42px}}</style></head><body><main class="wrap"><h1>🧩 8×8 拼圖求解器</h1><p class="muted">點擊格子設定障礙物，修改積木尺寸後按「開始求解」。</p><section class="panel"><h2>棋盤</h2><div class="board" id="board"></div><div class="buttons"><button id="solve">開始求解</button><button class="hintbtn" id="hintBtn">💡 提示</button><button class="secondary" id="checkBtn">🔎 這題有解嗎？</button><button class="secondary" id="reset">清除解答</button><button class="secondary" id="clear">清除障礙物</button><button class="secondary" id="clearAll">全部清除</button></div><div class="status" id="status">等待開始。請點擊格子設定障礙物。</div></section><section class="panel"><h2>積木清單</h2><p class="muted">尺寸依照片暫估，可自行修改；旋轉由程式自動處理。</p><table><thead><tr><th>積木</th><th>形狀</th><th>顏色</th><th>寬</th><th>高</th><th>格數</th></tr></thead><tbody id="pieces"></tbody></table><div class="buttons"><button class="secondary" id="add">新增積木</button></div><small>每塊積木只能使用一次。灰色三塊視為障礙物，不列入待放積木。</small></section></main><script>
const N=8;const colors=['#2865b8','#d74646','#e7a900','#f0c52b','#f59e0b','#8390a0','#3479d7','#d85c58','#16a085','#8b5cf6','#f97316','#64748b'];
const initial=[{id:'A',w:4,h:2,color:'#3479d7'},{id:'B',w:4,h:3,color:'#ca4949'},{id:'C',w:4,h:1,color:'#c3c1c1'},{id:'D',w:3,h:3,color:'#f5ce0a'},{id:'E',w:2,h:2,color:'#f5ce0a'},{id:'F',w:5,h:1,color:'#c3c1c1'},{id:'G',w:3,h:2,color:'#3479d7'},{id:'H',w:5,h:2,color:'#ca4949'}];let pieces=structuredClone(initial),blocks=new Set(),solution=null,placed={};
const $=id=>document.getElementById(id);const pc=i=>pieces[i]?.color||colors[i%colors.length];const idx=(r,c)=>r*N+c;function preset(){blocks=new Set();solution=null;renderBoard()}
function updateStatus(s){$('status').textContent=s}function renderBoard(){if(hint.sig&&hint.sig!==sig())hint=newHint();let html='';const same=(r,c,v)=>r>=0&&r<N&&c>=0&&c<N&&solution[idx(r,c)]===v;for(let i=0;i<64;i++){const v=solution?.[i],block=blocks.has(i);let style='',label=block?'×':'';if(v&&!block){const r=Math.floor(i/8),c=i%8,t=same(r-1,c,v),b=same(r+1,c,v),l=same(r,c-1,v),rt=same(r,c+1,v);const rad=(a,b2)=>a||b2?'0':'8px';const pl=placed[v];style=`background:${pc(pieces.findIndex(p=>p.id===v))};border:solid #fff;border-width:${t?0:2}px ${rt?0:2}px ${b?0:2}px ${l?0:2}px;border-radius:${rad(t,l)} ${rad(t,rt)} ${rad(b,rt)} ${rad(b,l)}`;if(!t&&!l&&pl)label=`${pl.w}×${pl.h}`}html+=`<div class="cell ${block?'block':v?'filled':''} ${hint.cell===i?'hint':''}" data-i="${i}" style="${style}" title="第 ${Math.floor(i/8)+1} 列，第 ${i%8+1} 欄${v?`（積木 ${v}）`:''}">${label||(hint.cell===i?'?':'')}</div>`}$('board').innerHTML=html;document.querySelectorAll('.cell').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(blocks.has(i))blocks.delete(i);else blocks.add(i);solution=null;renderBoard();updateStatus('障礙物已更新，請重新求解。')})}
function renderPieces(){let html='';pieces.forEach((p,i)=>html+=`<tr><td><span class="swatch" style="background:${pc(i)}"></span>${p.id}</td><td><div style="width:${p.w*12}px;height:${p.h*12}px;background-color:${pc(i)};background-image:linear-gradient(to right,#fff9 1px,transparent 1px),linear-gradient(to bottom,#fff9 1px,transparent 1px);background-size:12px 12px;border-radius:3px"></div></td><td><input type="color" data-color="${i}" value="${pc(i)}" style="width:40px;height:30px;padding:0;border:0;background:none;cursor:pointer"></td><td><input type="number" min="1" max="8" data-i="${i}" data-d="w" value="${p.w}"></td><td><input type="number" min="1" max="8" data-i="${i}" data-d="h" value="${p.h}"></td><td>${p.w*p.h} <button class="secondary" data-remove="${i}" style="padding:5px 8px;float:right">刪除</button></td></tr>`);$('pieces').innerHTML=html;document.querySelectorAll('input[data-i]').forEach(el=>el.onchange=()=>{const v=Number(el.value);if(!Number.isInteger(v)||v<1||v>8){el.value=pieces[+el.dataset.i][el.dataset.d];return}pieces[+el.dataset.i][el.dataset.d]=v;solution=null;renderBoard();renderPieces()});document.querySelectorAll('input[data-color]').forEach(el=>{el.oninput=()=>{pieces[+el.dataset.color].color=el.value;renderBoard()};el.onchange=()=>renderPieces()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{pieces.splice(+el.dataset.remove,1);solution=null;renderBoard();renderPieces()})}
// Complete first-empty-cell search: enumerate every rectangle placement COVERING the chosen empty cell.
function solvePuzzle(silent){const area=pieces.reduce((s,p)=>s+p.w*p.h,0);if(area!==64-blocks.size){if(silent)return{error:`面積不符合：積木總面積 ${area} 格，但可填空間 ${64-blocks.size} 格。請檢查積木尺寸與障礙物。`};updateStatus(`面積不符合：積木總面積 ${area} 格，但可填空間 ${64-blocks.size} 格。\n請檢查積木尺寸與障礙物。`);return}const board=Array(64).fill(null);for(const b of blocks)board[b]='#';const used=Array(pieces.length).fill(false);const cur={};let nodes=0;const start=performance.now();function dfs(left){nodes++;if(left===0)return board.every(v=>v!==null);let target=board.indexOf(null);if(target===-1)return false;const tr=Math.floor(target/8),tc=target%8;for(let i=0;i<pieces.length;i++){if(used[i])continue;const p=pieces[i];const orientations=p.w===p.h?[[p.w,p.h]]:[[p.w,p.h],[p.h,p.w]];for(const [w,h] of orientations){for(let r=Math.max(0,tr-h+1);r<=Math.min(tr,N-h);r++)for(let c=Math.max(0,tc-w+1);c<=Math.min(tc,N-w);c++){let cells=[],ok=true;for(let y=r;y<r+h&&ok;y++)for(let x=c;x<c+w;x++){const k=idx(y,x);if(board[k]!==null){ok=false;break}cells.push(k)}if(!ok)continue;for(const k of cells)board[k]=p.id;used[i]=true;cur[p.id]={w,h};if(dfs(left-1))return true;used[i]=false;for(const k of cells)board[k]=null}}}return false}const found=dfs(pieces.length);if(silent)return{found,board:board.slice(),cur,nodes};solution=found?board.slice():null;placed=found?cur:{};renderBoard();updateStatus(found?`找到一組解答！搜尋 ${nodes.toLocaleString()} 個節點，耗時 ${(performance.now()-start).toFixed(1)} ms。`:`找不到解答。搜尋 ${nodes.toLocaleString()} 個節點，耗時 ${(performance.now()-start).toFixed(1)} ms。請核對積木尺寸及障礙物。`)}
$('solve').onclick=()=>{hint=newHint();updateStatus('計算中…');setTimeout(()=>solvePuzzle(),20)};$('reset').onclick=()=>{hint=newHint();solution=null;renderBoard();updateStatus('已清除解答。')};$('clear').onclick=()=>{blocks.clear();solution=null;renderBoard();updateStatus('已清除障礙物。')};$('clearAll').onclick=()=>{blocks.clear();pieces=[];solution=null;placed={};renderBoard();renderPieces();updateStatus('已全部清除。')};$('add').onclick=()=>{pieces.push({id:String.fromCharCode(65+pieces.length),w:1,h:1});solution=null;renderBoard();renderPieces()};
// 提示系統：每塊積木分兩步（先提示位置，再顯示答案），逐塊累積；提示一律依照完整解答，保證不會誤導。
function newHint(){return{sig:'',n:0,stage:0,cell:null}}
let hint=newHint(),hintCache={sig:'',res:null};
function sig(){return JSON.stringify([[...blocks].sort((a,b)=>a-b),pieces.map(p=>[p.id,p.w,p.h])])}
function fullSolution(){const s=sig();if(hintCache.sig!==s)hintCache={sig:s,res:solvePuzzle(true)};return hintCache.res}
const cheers=['做得很好！','你很棒喔！','加油，快完成了！','慢慢來，沒問題的！','好棒，繼續！'];
function checkSolvable(){const res=fullSolution();if(res.error)return updateStatus(res.error);updateStatus(res.found?'✅ 這題有解答，放心慢慢想！需要的話可以按「提示」。':'❌ 這題找不到解答。不是你的問題，請檢查障礙物位置或積木尺寸。')}
function giveHint(){const res=fullSolution();if(res.error)return updateStatus(res.error);if(!res.found)return updateStatus('❌ 這題找不到解答。不是你的問題，請檢查障礙物位置或積木尺寸。');
 const s=sig();if(hint.sig!==s)hint={sig:s,n:0,stage:0,cell:null};
 const order=[...new Set(res.board.filter(v=>v&&v!=='#'))].sort((a,b)=>res.board.indexOf(a)-res.board.indexOf(b));
 if(hint.n>=order.length){hint.cell=null;return updateStatus('🎉 所有積木都已經顯示囉！')}
 const id=order[hint.n],p=pieces.find(q=>q.id===id);
 const show=n=>{const b=Array(64).fill(null);for(const k of blocks)b[k]='#';placed={};order.slice(0,n).forEach(o=>{res.board.forEach((v,i)=>{if(v===o)b[i]=o});placed[o]=res.cur[o]});solution=b};
 {hint.stage=0;hint.cell=null;hint.n++;show(hint.n);renderBoard();updateStatus(`✅ 積木 ${id}（${res.cur[id].w}×${res.cur[id].h}）放在這裡！已完成 ${hint.n}/${order.length} 塊。${hint.n<order.length?cheers[hint.n%cheers.length]:'🎉 全部完成！'}`)}}
$('hintBtn').onclick=giveHint;$('checkBtn').onclick=checkSolvable;
renderPieces();preset();
</script></body></html>
