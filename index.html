<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人理財與購物工具集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'finance': '#0694a5',
                        'shopping': '#a55eea',
                    }
                }
            }
        }
    </script>
</head>
<body class="p-4">
    <div class="max-w-4xl w-full mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4">實用生活小幫手</h1>
        <p class="text-xl text-gray-500 mb-12">選擇您想使用的計算或比較工具</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 房貸計算器卡片 -->
            <a href="calculateMortgage.html" class="tool-card block p-8 rounded-2xl bg-white border-b-4 border-finance hover:border-b-8">
                <div class="flex flex-col items-center">
                    <svg class="w-16 h-16 text-finance mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">房貸還款計算</h2>
                    <p class="text-gray-500">計算貸款期限、每月還款金額及總利息支出。</p>
                </div>
            </a>

            <!-- 購物換算卡片 -->
            <a href="shoppingCalculator.html" class="tool-card block p-8 rounded-2xl bg-white border-b-4 border-shopping hover:border-b-8">
                <div class="flex flex-col items-center">
                    <svg class="w-16 h-16 text-shopping mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">購物性價比換算</h2>
                    <p class="text-gray-500">比較不同容量或包裝商品的單位價格，找到最划算選項。</p>
                </div>
            </a>
        </div>
        
    </div>
</body>
</html>
