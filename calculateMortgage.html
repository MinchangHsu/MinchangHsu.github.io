<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房貸還款計畫計算器 - 專業準確版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        :root {
            --primary: #6366f1;
            --rose: #fb7185;
            --emerald: #10b981;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            color: #1e293b;
        }

        .number-font {
            font-family: 'Montserrat', sans-serif;
            word-break: break-all;
            line-height: 1.2;
        }

        .jelly-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: white;
            border-color: var(--primary);
            outline: none;
        }

        input[type="radio"]:checked + label {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .table-container {
            max-height: 600px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .table-container::-webkit-scrollbar { width: 6px; }
        .table-container::-webkit-scrollbar-thumb { background-color: var(--primary); border-radius: 10px; }

        .interest-saving-box {
            animation: pulse-saving 2s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        @keyframes pulse-saving {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .btn-jelly {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-jelly:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4);
        }
    </style>
    <script>
        /**
         * 核心計算邏輯
         */
        function calculateMortgage(loanAmount, annualRate, graceMonths, loanYears, method) {
            const totalMonths = loanYears * 12;
            const monthlyRate = annualRate / 12;
            const amortizationMonths = totalMonths - graceMonths;
            
            let remainingPrincipal = loanAmount;
            const results = [];
            let totalInterest = 0;

            if (amortizationMonths <= 0) return { results: [], totalInterest: 0 };

            // 若為 EMI (本息平均攤還)，先計算固定月付額
            let emi = 0;
            if (method === 'EMI') {
                if (monthlyRate > 0) {
                    emi = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, amortizationMonths)) / (Math.pow(1 + monthlyRate, amortizationMonths) - 1);
                } else {
                    emi = loanAmount / amortizationMonths;
                }
            }

            // 本金平均攤還的每月應還本金
            const cpmPrincipalPerMonth = loanAmount / amortizationMonths;

            for (let month = 1; month <= totalMonths; month++) {
                let interestPayment = remainingPrincipal * monthlyRate;
                let principalPayment = 0;
                let monthlyPayment = 0;

                if (month <= graceMonths) {
                    // 寬限期內只付利息
                    principalPayment = 0;
                    monthlyPayment = interestPayment;
                } else {
                    if (method === 'EMI') {
                        // 本息平均攤還
                        monthlyPayment = emi;
                        principalPayment = monthlyPayment - interestPayment;
                    } else {
                        // 本金平均攤還
                        principalPayment = cpmPrincipalPerMonth;
                        monthlyPayment = principalPayment + interestPayment;
                    }

                    // 處理最後一期的尾差
                    if (month === totalMonths) {
                        principalPayment = remainingPrincipal;
                        monthlyPayment = principalPayment + interestPayment;
                    }
                    
                    remainingPrincipal -= principalPayment;
                }

                totalInterest += interestPayment;
                
                results.push({
                    month,
                    monthlyPayment: Math.round(monthlyPayment),
                    interestPayment: Math.round(interestPayment),
                    principalPayment: Math.round(principalPayment),
                    remainingPrincipal: Math.max(0, Math.round(remainingPrincipal))
                });
            }

            return { results, totalInterest: Math.round(totalInterest) };
        }

        function handleCalculation() {
            const loanAmountInput = parseFloat(document.getElementById('loanAmount').value) || 0;
            const loanAmount = loanAmountInput * 10000; // 萬轉元
            const annualRate = (parseFloat(document.getElementById('annualRate').value) || 0) / 100;
            const graceMonths = parseInt(document.getElementById('graceMonths').value) || 0;
            const loanYears = parseInt(document.getElementById('loanYears').value) || 0;
            const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            const summaryContainer = document.getElementById('summaryContainer');
            const resultContainer = document.getElementById('resultsContainer');

            if (loanAmount <= 0 || loanYears <= 0) {
                summaryContainer.innerHTML = `<div class="p-6 glass-container text-rose-500 rounded-3xl font-bold text-center">⚠️ 請輸入有效的貸款資訊。</div>`;
                resultContainer.innerHTML = '';
                return;
            }

            const resEMI = calculateMortgage(loanAmount, annualRate, graceMonths, loanYears, 'EMI');
            const resCPM = calculateMortgage(loanAmount, annualRate, graceMonths, loanYears, 'CPM');
            
            const current = selectedMethod === 'EMI' ? resEMI : resCPM;
            const other = selectedMethod === 'EMI' ? resCPM : resEMI;
            
            // 比較利息差
            const interestDiff = other.totalInterest - current.totalInterest;
            const totalPayment = current.results.reduce((s, i) => s + i.monthlyPayment, 0);

            // 更新摘要 (優化大數字佈局)
            summaryContainer.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-8 bg-indigo-500 rounded-full"></div>
                        <h3 class="text-xl font-black text-slate-800">試算彙總</h3>
                    </div>
                    <span class="px-4 py-1 bg-indigo-100 text-indigo-600 rounded-full text-xs font-bold">
                        ${selectedMethod === 'EMI' ? '本息平均攤還' : '本金平均攤還'}
                    </span>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="p-4 glass-container rounded-[1.5rem] flex flex-col justify-center min-w-0">
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 truncate">總利息支出</div>
                        <div class="text-xl md:text-2xl number-font font-black text-rose-500 truncate">$${current.totalInterest.toLocaleString()}</div>
                    </div>
                    <div class="p-4 glass-container rounded-[1.5rem] flex flex-col justify-center min-w-0">
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 truncate">總還款金額</div>
                        <div class="text-xl md:text-2xl number-font font-black text-slate-800 truncate">$${totalPayment.toLocaleString()}</div>
                    </div>
                    <div class="p-4 glass-container rounded-[1.5rem] flex flex-col justify-center min-w-0">
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 truncate">首期還款</div>
                        <div class="text-xl md:text-2xl number-font font-black text-indigo-500 truncate">$${current.results[0].monthlyPayment.toLocaleString()}</div>
                    </div>
                    <div class="p-4 ${interestDiff > 0 ? 'interest-saving-box' : 'glass-container'} rounded-[1.5rem] flex flex-col justify-center min-w-0">
                        <div class="text-[10px] font-black ${interestDiff > 0 ? 'text-emerald-600' : 'text-slate-400'} uppercase tracking-widest mb-1 truncate">
                            ${interestDiff > 0 ? '省下利息' : '末期還款'}
                        </div>
                        <div class="text-xl md:text-2xl number-font font-black ${interestDiff > 0 ? 'text-emerald-600' : 'text-slate-800'} truncate">
                            ${interestDiff > 0 ? '+$' + interestDiff.toLocaleString() : '$' + current.results[current.results.length-1].monthlyPayment.toLocaleString()}
                        </div>
                    </div>
                </div>
            `;

            // 更新表格
            const tableRows = current.results.map(item => `
                <tr class="${item.month <= graceMonths ? 'bg-indigo-50/40' : ''} border-b border-indigo-50/30 transition-colors hover:bg-white/40">
                    <td class="p-3 number-font font-bold text-center text-slate-400 text-[10px]">${item.month}</td>
                    <td class="p-3 number-font font-black text-center text-slate-700 text-sm md:text-base">$${item.monthlyPayment.toLocaleString()}</td>
                    <td class="p-3 number-font font-bold text-center text-rose-400 text-sm">$${item.interestPayment.toLocaleString()}</td>
                    <td class="p-3 number-font font-bold text-center text-emerald-500 text-sm">$${item.principalPayment.toLocaleString()}</td>
                    <td class="p-3 number-font font-medium text-center text-slate-400 text-xs">$${item.remainingPrincipal.toLocaleString()}</td>
                </tr>
            `).join('');

            resultContainer.innerHTML = `
                <div class="mt-8">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-2 h-6 bg-amber-400 rounded-full"></div>
                        <h3 class="text-lg font-black text-slate-800">每月還款清單</h3>
                    </div>
                    <div class="table-container glass-container rounded-[2rem] p-2 md:p-4 overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[500px]">
                            <thead>
                                <tr class="text-[10px] font-black text-indigo-400 uppercase tracking-widest border-b border-indigo-100/50">
                                    <th class="p-3 text-center">期別</th>
                                    <th class="p-3 text-center">月付金</th>
                                    <th class="p-3 text-center">利息額</th>
                                    <th class="p-3 text-center">本金額</th>
                                    <th class="p-3 text-center">剩餘本金</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.onload = handleCalculation;
    </script>
</head>
<body class="flex flex-col items-center py-8 px-4 md:px-8">

    <!-- 背景裝飾 -->
    <div class="jelly-blob w-72 h-72 bg-indigo-200 top-[-5%] left-[-5%] opacity-60"></div>
    <div class="jelly-blob w-64 h-64 bg-rose-100 bottom-[-5%] right-[-5%] opacity-50" style="animation-delay: -5s;"></div>

    <div class="max-w-6xl w-full relative z-10">
        <!-- 導航 -->
        <a href="index.html" class="inline-flex items-center gap-2 text-indigo-500 font-black text-[10px] uppercase tracking-widest mb-6 hover:translate-x-[-4px] transition-transform">
            ← 返回首頁
        </a>

        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-[900] text-slate-800 mb-1 tracking-tight">房貸計畫計算器</h1>
            <p class="text-slate-400 text-xs font-bold tracking-widest uppercase">Smart Mortgage Analytics</p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-8">
            
            <!-- 左側輸入面板 -->
            <div class="xl:col-span-4 glass-container rounded-[2rem] p-6 h-fit">
                <h2 class="text-xs font-black text-indigo-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full"></span> 貸款參數設定
                </h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-[10px] font-black text-slate-400 mb-1 ml-1 uppercase">貸款總額 (萬)</label>
                            <input type="number" id="loanAmount" value="1000" class="glass-input w-full p-3 rounded-xl number-font font-bold text-slate-700 text-lg">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 ml-1 uppercase">年利率 (%)</label>
                            <input type="number" id="annualRate" value="2.18" step="0.01" class="glass-input w-full p-3 rounded-xl number-font font-bold text-slate-700 text-lg">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 ml-1 uppercase">貸款年限 (年)</label>
                            <input type="number" id="loanYears" value="30" class="glass-input w-full p-3 rounded-xl number-font font-bold text-slate-700 text-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 ml-1 uppercase">寬限期 (月)</label>
                        <input type="number" id="graceMonths" value="0" class="glass-input w-full p-3 rounded-xl number-font font-bold text-slate-700 text-lg">
                    </div>

                    <div class="pt-4 space-y-2">
                        <input type="radio" id="methodEmi" name="paymentMethod" value="EMI" checked class="hidden" onchange="handleCalculation()">
                        <label for="methodEmi" class="block cursor-pointer p-3 glass-container rounded-xl text-xs font-bold text-slate-600 text-center transition-all">
                            本息平均攤還 (每月還款固定)
                        </label>

                        <input type="radio" id="methodCpm" name="paymentMethod" value="CPM" class="hidden" onchange="handleCalculation()">
                        <label for="methodCpm" class="block cursor-pointer p-3 glass-container rounded-xl text-xs font-bold text-slate-600 text-center transition-all">
                            本金平均攤還 (利息遞減)
                        </label>
                    </div>

                    <button onclick="handleCalculation()" class="w-full py-4 btn-jelly text-white font-black rounded-xl shadow-lg mt-2 uppercase tracking-widest text-xs">
                        重新試算
                    </button>
                </div>
            </div>

            <!-- 右側結果展示區 -->
            <div class="xl:col-span-8 flex flex-col gap-6">
                <!-- 彙總卡片 -->
                <div id="summaryContainer" class="p-6 md:p-8 glass-container rounded-[2rem]">
                    <!-- JS 動態注入 -->
                </div>
                
                <!-- 提示資訊 -->
                <div class="p-5 glass-container rounded-[2rem] bg-indigo-500/5 border-indigo-100 flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
                        <span class="text-amber-600 text-lg">💡</span>
                    </div>
                    <p class="text-xs text-slate-500 leading-relaxed font-medium">
                        <strong class="text-slate-700">計算提示：</strong> 本工具採「月」為單位進行複利計算。本金與利息經四捨五入處理，最後一期會自動補足尾差，確保剩餘本金精確歸零。
                    </p>
                </div>

                <!-- 清單表格 -->
                <div id="resultsContainer">
                    <!-- JS 動態注入 -->
                </div>
            </div>
        </div>

        <div class="py-12 text-center opacity-20">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">FinTech Precise Logic • 2024 Edition</p>
        </div>
    </div>

</body>
</html>
