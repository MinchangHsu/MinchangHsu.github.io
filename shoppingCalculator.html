<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聰明省錢換算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #10b981;
            --accent: #f59e0b;
        }

        body { 
            font-family: 'Noto Sans TC', 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 100%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .tab-btn {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            color: var(--primary);
            transform: scale(1.1);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 4px;
            background: var(--primary);
            border-radius: 10px;
        }

        .input-group:focus-within label {
            color: var(--primary);
        }

        .btn-gradient {
            background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .best-badge {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        /* 隱藏滾動條 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .number-font { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- 導航返回功能：僅新增此區域 -->

    <!-- Top Branding -->
    <header class="pt-8 px-6 text-left">
        <div class="max-w-md w-full mb-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-indigo-500 font-black text-[10px] uppercase tracking-widest hover:text-indigo-700 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
                </svg>
                返回首頁
            </a>
        </div>
    </header>

    <!-- Top Branding -->
    <header class="pt-1 pb-4 px-6 text-center">
        <div class="inline-block bg-white/50 backdrop-blur px-4 py-1 rounded-full text-[10px] font-black tracking-widest text-indigo-500 uppercase mb-2">
            Smart Shopping Assistant
        </div>
        <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
            省錢神助手
        </h1>
    </header>

    <!-- 分頁導航 (膠囊造型) -->
    <nav class="sticky top-0 z-50 px-4 py-2">

        <div class="max-w-md mx-auto glass-card rounded-2xl flex p-1 overflow-x-auto hide-scrollbar">
            <button onclick="switchTab('drink')" id="tab-drink" class="tab-btn active flex-1 py-3 text-sm font-bold whitespace-nowrap px-4">🥤 飲品</button>
            <button onclick="switchTab('weight')" id="tab-weight" class="tab-btn flex-1 py-3 text-sm font-bold text-slate-400 whitespace-nowrap px-4">⚖️ 重量</button>
            <button onclick="switchTab('unit')" id="tab-unit" class="tab-btn flex-1 py-3 text-sm font-bold text-slate-400 whitespace-nowrap px-4">📦 單價</button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 pb-32">

        
        <!-- 輸入區 -->
        <section class="glass-card rounded-[2.5rem] p-8 mb-8">
            <div class="mb-6">
                <h2 id="tab-title" class="text-xl font-black text-slate-800 tracking-tight">飲品性價比</h2>
                <p id="tab-desc" class="text-xs font-medium text-slate-400 mt-1">每一塊錢能買到多少容量？</p>
            </div>

            <div class="space-y-5">
                <!-- 商品名稱 -->
                <div class="input-group">
                    <label class="text-[11px] font-black text-slate-400 ml-1 mb-1 block uppercase tracking-wider">Product Name</label>
                    <input type="text" id="name" placeholder="輸入商品名稱..." class="w-full bg-slate-100/50 border-2 border-transparent focus:border-indigo-100 focus:bg-white rounded-2xl p-4 transition-all outline-none font-medium placeholder:text-slate-300">
                </div>

                <!-- 變數區 -->
                <div class="grid grid-cols-2 gap-4">
                    <div id="field-v1-container">
                        <label id="label-v1" class="text-[11px] font-black text-slate-400 ml-1 mb-1 block uppercase tracking-wider">Quantity</label>
                        <input type="number" id="v1" value="1" inputmode="numeric" class="number-font w-full bg-slate-100/50 border-2 border-transparent focus:border-indigo-100 focus:bg-white rounded-2xl p-4 transition-all outline-none font-bold text-lg">
                    </div>
                    <div id="field-v2-container">
                        <label id="label-v2" class="text-[11px] font-black text-slate-400 ml-1 mb-1 block uppercase tracking-wider">Volume (ml)</label>
                        <input type="number" id="v2" placeholder="0" inputmode="decimal" class="number-font w-full bg-slate-100/50 border-2 border-transparent focus:border-indigo-100 focus:bg-white rounded-2xl p-4 transition-all outline-none font-bold text-lg">
                    </div>
                </div>

                <!-- 價格區 -->
                <div>
                    <label class="text-[11px] font-black text-slate-400 ml-1 mb-1 block uppercase tracking-wider">Total Price (NT$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-black text-slate-400 text-lg">$</span>
                        <input type="number" id="price" placeholder="0" inputmode="decimal" class="number-font w-full bg-slate-50 border-2 border-slate-100 focus:border-indigo-400 rounded-2xl p-4 pl-8 transition-all outline-none font-black text-2xl text-indigo-600">
                    </div>
                </div>

                <button onclick="calculateAndAdd()" class="btn-gradient w-full text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-200 mt-2 flex justify-center items-center gap-2">
                    <span>➕ 加入比較</span>
                </button>
            </div>
        </section>

        <!-- 列表標題 -->
        <div class="flex justify-between items-end px-2 mb-4">
            <h3 class="font-black text-slate-800">比較清單</h3>
            <button onclick="clearAll()" class="text-xs font-bold text-rose-400 hover:text-rose-600 transition-colors">全部清除</button>
        </div>

        <!-- 比較列表 -->
        <div class="space-y-4" id="list-container">
            <!-- JS Render -->
        </div>

    </main>

    <!-- Toast 通知 -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 glass-card border-indigo-200 text-indigo-600 px-8 py-3 rounded-full text-sm font-black opacity-0 transition-all duration-300 z-[100] translate-y-[-20px]">
        已更新
    </div>

    <script>
        let currentTab = 'drink';
        let items = { drink: [], weight: [], unit: [] };

        const config = {
            drink: {
                title: "飲品性價比",
                desc: "每一塊錢能喝到多少毫升 (ML/元)",
                l1: "數量 (瓶/罐)",
                l2: "容量 (ml)",
                unit: "ml/元",
                better: "high"
            },
            weight: {
                title: "重量性價比",
                desc: "每一塊錢能買到多少重量 (g/元)",
                l1: "數量 (包/盒)",
                l2: "重量 (g)",
                unit: "g/元",
                better: "high"
            },
            unit: {
                title: "單件性價比",
                desc: "每一件物品平均是多少錢 (元/件)",
                l1: "總數量",
                l2: "",
                unit: "元/件",
                better: "low"
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'text-indigo-600');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('active', 'text-indigo-600');
            activeBtn.classList.remove('text-slate-400');

            document.getElementById('tab-title').innerText = config[tab].title;
            document.getElementById('tab-desc').innerText = config[tab].desc;
            document.getElementById('label-v1').innerText = config[tab].l1;
            
            if (tab === 'unit') {
                document.getElementById('field-v2-container').classList.add('hidden');
                document.getElementById('field-v1-container').classList.replace('col-span-1', 'col-span-2');
            } else {
                document.getElementById('field-v2-container').classList.remove('hidden');
                document.getElementById('field-v1-container').classList.replace('col-span-2', 'col-span-1');
                document.getElementById('label-v2').innerText = config[tab].l2;
            }
            render();
        }

        function calculateAndAdd() {
            const name = document.getElementById('name').value || '未命名項目';
            const v1 = parseFloat(document.getElementById('v1').value) || 0;
            const v2 = parseFloat(document.getElementById('v2').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;

            if (price <= 0 || v1 <= 0) {
                showToast("⚠️ 請輸入正確數值");
                return;
            }

            let result = 0;
            if (currentTab === 'unit') {
                result = price / v1;
            } else {
                result = (v1 * v2) / price;
            }

            items[currentTab].push({
                id: Date.now(),
                name,
                v1, v2, price,
                result: result
            });

            // Reset
            document.getElementById('name').value = '';
            document.getElementById('v2').value = '';
            document.getElementById('price').value = '';
            
            showToast("✨ 已加入清單");
            render();
        }

        function deleteItem(id) {
            items[currentTab] = items[currentTab].filter(i => i.id !== id);
            render();
        }

        function clearAll() {
            items[currentTab] = [];
            render();
        }

        function render() {
            const container = document.getElementById('list-container');
            const data = items[currentTab];
            const type = config[currentTab];

            let sorted = [...data].sort((a, b) => {
                return type.better === 'high' ? b.result - a.result : a.result - b.result;
            });

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 opacity-20">
                        <span class="text-6xl mb-4">🔍</span>
                        <p class="text-sm font-bold">尚無數據，開始計算吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sorted.map((item, index) => {
                const isBest = index === 0;
                return `
                    <div class="glass-card rounded-[2rem] p-6 flex justify-between items-center transition-all ${isBest ? 'ring-2 ring-indigo-500 bg-white/100' : ''}">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-lg font-black text-slate-800 leading-tight">${item.name}</span>
                                ${isBest ? '<span class="best-badge text-white text-[9px] font-black px-2 py-0.5 rounded-lg flex items-center gap-1">🏆 BEST</span>' : ''}
                            </div>
                            <p class="text-[10px] font-bold text-slate-400">
                                規格：${item.v1}  ${currentTab === 'unit' ? '件' : ' x ' + item.v2 + (currentTab === 'weight' ? 'g' : 'ml')} / 總額：$${item.price}
                            </p>
                        </div>
                        <div class="text-right">
                            <div class="number-font text-2xl font-black ${isBest ? 'text-indigo-600' : 'text-slate-600'}">
                                ${item.result.toFixed(2)}
                                <span class="text-[10px] font-bold text-slate-300 uppercase">${type.unit}</span>
                            </div>
                            <button onclick="deleteItem(${item.id})" class="text-[10px] font-black text-rose-300 hover:text-rose-500 mt-1">REMOVE</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px)';
            }, 2000);
        }

        // Init
        switchTab('drink');
    </script>
</body>
</html>
